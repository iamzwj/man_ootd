name: Deploy OOTD to Tencent Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *'
permissions:
  contents: read
concurrency:
  group: ootd-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_HOST: 49.235.121.231
      SERVER_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate website
        run: |
          node --check app.js
          node --check feed-utils.mjs
          node --test tests/feed.test.mjs
          test -s index.html && test -s style.css
          python -m pip install --disable-pip-version-check -q Pillow requests
      - name: Discover and cache fresh public image references
        if: github.event_name != 'push'
        run: python scripts/collect.py --discover --previous-url https://ootd.17design.fun --max-images 900 --workers 10
      - name: Preserve previously collected images on code releases
        if: github.event_name == 'push'
        run: python scripts/collect.py --previous-url https://ootd.17design.fun --max-images 900 --workers 10
      - name: Validate feed and package complete site
        run: |
          python scripts/validate_feed.py
          tar -czf /tmp/ootd.tar.gz index.html style.css app.js feed-utils.mjs data images
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload release
        run: scp /tmp/ootd.tar.gz "$SERVER_USER@$SERVER_HOST:/home/ubuntu/man_ootd/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
      - name: Activate independent OOTD release
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "bash -s -- $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          run_id="$1"; attempt="$2"
          [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]]
          exec 9>/home/ubuntu/man_ootd/deploy.lock
          flock -x 9
          archive="/home/ubuntu/man_ootd/$run_id-$attempt.tar.gz"
          release="/var/www/ootd/releases/run-$run_id-$attempt"
          previous=$(readlink -f /var/www/ootd/public)
          sudo install -d -m 755 "$release"
          sudo tar -xzf "$archive" -C "$release" --no-same-owner
          sudo find "$release" -type d -exec chmod 755 {} +
          sudo find "$release" -type f -exec chmod 644 {} +
          sudo ln -s "$release" /var/www/ootd/public.next
          sudo mv -Tf /var/www/ootd/public.next /var/www/ootd/public
          if ! curl --fail --silent --show-error --resolve ootd.17design.fun:443:127.0.0.1 https://ootd.17design.fun/data/feed.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["items"]) >= 12'; then
            sudo ln -s "$previous" /var/www/ootd/public.rollback
            sudo mv -Tf /var/www/ootd/public.rollback /var/www/ootd/public
            exit 1
          fi
          rm "$archive"
          sudo nginx -t
          # Cache previews once per release; retain latest 3 releases for rollback.
          sudo find /var/www/ootd/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +4 | cut -d' ' -f2- | while IFS= read -r old; do
            [ "$old" = "$release" ] || sudo rm -rf -- "$old"
          done
          REMOTE
      - name: Verify public site and existing D-Gen health
        run: |
          curl --fail --silent --show-error --retry 3 https://ootd.17design.fun/ | grep -q '氛围摄影'
          curl --fail --silent --show-error 'https://ootd.17design.fun/app.js?v=2' > /tmp/deployed-app.js
          cmp app.js /tmp/deployed-app.js
          curl --fail --silent --show-error https://ootd.17design.fun/data/feed.json > /tmp/deployed-feed.json
          python -c 'import json; d=json.load(open("/tmp/deployed-feed.json")); assert {"outfit","photo"} <= {p["channel"] for p in d["items"]}; print("Verified",len(d["items"]),"images")'
          curl --fail --silent --show-error https://app.17design.fun/api/health
