name: Deploy OOTD to Tencent Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ootd-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: 49.235.121.231
      SERVER_USER: ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: /tmp/ootd-vision-model
          key: ootd-clip-6ef1ebc-v1
      - name: Prepare visual screening model
        run: |
          python3 -m venv /tmp/ootd-build-venv
          /tmp/ootd-build-venv/bin/pip -q install onnxruntime numpy Pillow tokenizers
          /tmp/ootd-build-venv/bin/python deploy/prepare_vision.py /tmp/ootd-vision-model
          tar -czf /tmp/ootd-vision.tar.gz -C /tmp/ootd-vision-model vision.onnx prompts.npy
      - name: Validate live feed website
        run: |
          node --check app.js
          node --check sw.js
          node --check personal.js
          node --test tests/feed.test.mjs
          /tmp/ootd-build-venv/bin/python -m unittest discover -s tests -p 'test_*.py'
          python3 -m py_compile server.py personal.py email_auth.py deploy/configure_proxy.py
          tar -czf /tmp/ootd.tar.gz index.html style.css app.js personal.js feed-utils.js sw.js server.py personal.py email_auth.py visual_filter.py photo-catalog.json photographer-sources.json rejected-photo-fingerprints.json deploy
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Check server connection
        timeout-minutes: 2
        run: |
          ssh -v -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$SERVER_USER@$SERVER_HOST" 'printf "SSH connected\n"; df -h /home/ubuntu/man_ootd /var/lib; ls -lh /var/lib/ootd/vision/ 2>/dev/null || true'
      - name: Upload website release
        timeout-minutes: 2
        run: |
          ls -lh /tmp/ootd.tar.gz /tmp/ootd-vision.tar.gz
          scp -v -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 /tmp/ootd.tar.gz "$SERVER_USER@$SERVER_HOST:/home/ubuntu/man_ootd/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
      - name: Upload updated photography screening prompts
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=20 /tmp/ootd-vision-model/prompts.npy "$SERVER_USER@$SERVER_HOST:/home/ubuntu/man_ootd/prompts-$GITHUB_RUN_ID.npy"
      - name: Upload visual screening weights
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if ssh -o BatchMode=yes -o ConnectTimeout=20 "$SERVER_USER@$SERVER_HOST" 'test -s /var/lib/ootd/vision/vision.onnx && test -s /var/lib/ootd/vision/prompts.npy'; then
            echo "Reusing installed model"
          else
            rsync -tv --partial --append-verify --timeout=60 --info=progress2 -e 'ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3' /tmp/ootd-vision.tar.gz "$SERVER_USER@$SERVER_HOST:/home/ubuntu/man_ootd/vision-model.tar.gz"
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$SERVER_USER@$SERVER_HOST" "cp /home/ubuntu/man_ootd/vision-model.tar.gz /home/ubuntu/man_ootd/vision-$GITHUB_RUN_ID.tar.gz"
          fi
      - name: Activate OOTD on-demand service
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "bash -s -- $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          run_id="$1"; attempt="$2"
          [[ "$run_id" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]]
          exec 9>/home/ubuntu/man_ootd/deploy.lock
          flock -x 9
          archive="/home/ubuntu/man_ootd/$run_id-$attempt.tar.gz"
          release="/var/www/ootd/releases/run-$run_id-$attempt"
          previous=$(readlink -f /var/www/ootd/public)
          sudo install -d -m 755 "$release"
          sudo tar -xzf "$archive" -C "$release" --no-same-owner
          sudo find "$release" -type d -exec chmod 755 {} +
          sudo find "$release" -type f -exec chmod 644 {} +
          sudo ln -s "$release" /var/www/ootd/public.next
          sudo mv -Tf /var/www/ootd/public.next /var/www/ootd/public
          free -m
          sudo install -d -m 755 /var/lib/ootd/vision
          if [ -f "/home/ubuntu/man_ootd/vision-$run_id.tar.gz" ]; then
            sudo tar -xzf "/home/ubuntu/man_ootd/vision-$run_id.tar.gz" -C /var/lib/ootd/vision --no-same-owner
          fi
          sudo install -m 644 "/home/ubuntu/man_ootd/prompts-$run_id.npy" /var/lib/ootd/vision/prompts.npy
          rm -f "/home/ubuntu/man_ootd/prompts-$run_id.npy"
          sudo chmod 644 /var/lib/ootd/vision/*
          if [ ! -x /opt/ootd-venv/bin/python ]; then
            sudo python3 -m venv /opt/ootd-venv || {
              sudo apt-get update -qq
              sudo apt-get install -y python3-venv
              sudo python3 -m venv /opt/ootd-venv
            }
          fi
          sudo /opt/ootd-venv/bin/pip -q install --disable-pip-version-check onnxruntime numpy Pillow
          sudo install -m 644 "$release/deploy/ootd-feed.service" /etc/systemd/system/ootd-feed.service
          sudo python3 "$release/deploy/configure_proxy.py"
          sudo nginx -t
          sudo systemctl daemon-reload
          sudo systemctl enable ootd-feed
          sudo systemctl restart ootd-feed
          sudo systemctl reload nginx
          ready=0
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8794/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            sudo journalctl -u ootd-feed -n 25 --no-pager
            sudo ln -s "$previous" /var/www/ootd/public.rollback
            sudo mv -Tf /var/www/ootd/public.rollback /var/www/ootd/public
            exit 1
          fi
          curl --fail --silent --show-error --resolve ootd.17design.fun:443:127.0.0.1 https://ootd.17design.fun/api/health
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          base=Path('/var/www/ootd/releases')
          for release in base.iterdir():
              images=release/'images'
              if images.is_dir() and not images.is_symlink():shutil.rmtree(images)
          PY
          rm -f "$archive" "/home/ubuntu/man_ootd/vision-$run_id.tar.gz"
          REMOTE
      - name: Verify public live feed and existing D-Gen health
        run: |
          curl --fail --silent --show-error --retry 3 https://ootd.17design.fun/ | grep -q '氛围摄影'
          curl --fail --silent --show-error https://ootd.17design.fun/api/health | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"] == "live" and d["imageStorage"] is False'
          curl --fail --silent --show-error 'https://ootd.17design.fun/app.js?v=4' > /tmp/deployed-app.js
          cmp app.js /tmp/deployed-app.js
          curl --fail --silent --show-error --max-time 40 'https://ootd.17design.fun/api/discover?channel=photo&cursor=0' > /tmp/live-test.json
          python3 -c 'import json; d=json.load(open("/tmp/live-test.json")); print("Live images:",len(d["items"])); assert d["items"] and all(p.get("visualChecked") for p in d["items"])'
          curl --fail --silent --show-error https://app.17design.fun/api/health
