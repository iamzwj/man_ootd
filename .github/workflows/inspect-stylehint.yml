name: Inspect StyleHint public feed
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-stylehint.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public source structures
        env:
          KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 ubuntu@49.235.121.231 python3 - <<'PY' > /tmp/source-capture.txt
          import json,subprocess,base64,zlib,concurrent.futures as cf
          urls=[
          'https://www.stylehint.com/v2/jp/outfit?result_limit=20&page=1&option_gender=1&ranking_manner=daily_ranking&option_recency=1',
          'https://www.stylehint.com/v2/jp/outfit?result_limit=20&page=2&option_gender=1&ranking_manner=daily_ranking&option_recency=1',
          'https://api.stylehint.com/v2/jp/outfit?result_limit=20&page=1&option_gender=1&ranking_manner=daily_ranking&option_recency=1']
          def get(u):
            r=subprocess.run(['curl','--http1.1','-L','-sS','--connect-timeout','8','--max-time','30','-A','Mozilla/5.0','-H','Accept-Region: jp','-H','Accept-Language: ja',u],capture_output=True,timeout=32)
            return {'url':u,'error':r.stderr.decode()[:300],'body':base64.b64encode(zlib.compress(r.stdout)).decode()}
          with cf.ThreadPoolExecutor(max_workers=5) as pool:
            for r in pool.map(get,urls):print(json.dumps(r),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-structures
          path: /tmp/source-capture.txt
          retention-days: 1
