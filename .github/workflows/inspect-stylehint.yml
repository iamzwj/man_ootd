name: Inspect StyleHint public feed
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-stylehint.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public source structures
        env:
          KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=20 ubuntu@49.235.121.231 python3 - <<'PY' > /tmp/source-capture.txt
          import json,subprocess,base64,zlib,concurrent.futures as cf
          urls=[
          'https://www.stylehint.com/_next/static/PIEt3zab7_DEoIabjheG2/pages/_app.js',
          'https://www.stylehint.com/_next/static/chunks/a4e206e93845969b5baf9b7281a3c1e2cd168c67.695c267cc2301e623537.js',
          'https://www.beams.co.jp/styling/?sex=M',
          'https://wear.jp/men-ranking/',
          'https://www.flickr.com/services/feeds/photos_public.gne?format=json&nojsoncallback=1&tags=man,street&tagmode=all']
          def get(u):
            r=subprocess.run(['curl','--http1.1','-L','-sS','--connect-timeout','8','--max-time','30','-A','Mozilla/5.0',u],capture_output=True,timeout=32)
            return {'url':u,'error':r.stderr.decode()[:300],'body':base64.b64encode(zlib.compress(r.stdout)).decode()}
          with cf.ThreadPoolExecutor(max_workers=5) as pool:
            for r in pool.map(get,urls):print(json.dumps(r),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-structures
          path: /tmp/source-capture.txt
          retention-days: 1
